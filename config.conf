# /etc/unit-health/config.conf
#
# Configuration for unit-health(1).
#
# This file is sourced as a POSIX/Bash shell fragment on start-up, so use
# plain VARIABLE=value assignments. Quote values that contain spaces or
# special characters. Every setting below is shown with its built-in default
# and is commented out; uncomment and edit the ones you want to change.

# Services to omit from all output. Comma- or whitespace-separated. Names may
# be given with or without the ".service" suffix.
#IGNORE_SERVICES="apt-daily,apt-daily-upgrade,anacron"

# A running service using more than this many percent CPU is flagged as a
# warning (shown yellow / included by --alerts).
#CPU_ALERT_THRESHOLD=50

# A running service using more than this much memory (in MB) is flagged as a
# warning.
#MEMORY_ALERT_THRESHOLD=1000

# A running service that has restarted more than this many times is flagged
# as a warning.
#RESTART_ALERT_THRESHOLD=5

# Colored output by default: "yes" or "no". Colors are disabled automatically
# when output is not a terminal or when the NO_COLOR environment variable is
# set, regardless of this setting.
#USE_COLORS=yes

# Default output format when no format option is given on the command line:
# "table", "json" or "detailed".
#DEFAULT_FORMAT=table

# Default refresh interval (seconds) for --watch.
#WATCH_INTERVAL=2
